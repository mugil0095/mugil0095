name: update-recent-activity

on:
  schedule:
    - cron: "30 0 * * *"   # once a day, 00:30 UTC
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Recent Activity table and stats card
        run: python3 .github/scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain README.md .github/stats.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md .github/stats.svg
            git commit -m "chore: refresh recent activity and stats"
            git push
          fi
