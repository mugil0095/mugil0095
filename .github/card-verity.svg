r="3" fill="#0b1626"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="28" y="122" font-size="14.5" fill="#cfe3de">Ingests documents continuously and answers through a</text><text x="28" y="145" font-size="14.5" fill="#cfe3de">bounded multi-hop retrieval agent that refuses to answer</text><text x="28" y="168" font-size="14.5" fill="#cfe3de">rather than hallucinate when it lacks grounded evidence.</text><text x="28" y="191" font-size="14.5" fill="#cfe3de">Verified on a real SQuAD-derived corpus, not a toy.</text><rect x="28.0" y="228" width="136.2" height="24" rx="12.0" fill="#7fe0c8" fill-opacity="0.12" stroke="#7fe0c8" stroke-opacity="0.5"/><text x="39.0" y="244.2" font-size="11.5" fill="#e8fffa" textLength="114.2" lengthAdjust="spacingAndGlyphs">Hybrid BM25 + dense</text><rect x="171.2" y="228" width="122.3" height="24" rx="12.0" fill="#7fe0c8" fill-opacity="0.12" stroke="#7fe0c8" stroke-opacity="0.5"/><text x="182.2" y="244.2" font-size="11.5" fill="#e8fffa" textLength="100.3" lengthAdjust="spacingAndGlyphs">LightGBM reranker</text><rect x="300.5" y="228" width="127.7" height="24" rx="12.0" fill="#7fe0c8" fill-opacity="0.12" stroke="#7fe0c8" stroke-opacity="0.5"/><text x="311.5" y="244.2" font-size="11.5" fill="#e8fffa" textLength="105.7" lengthAdjust="spacingAndGlyphs">Query reformulation</text><rect x="435.2" y="228" width="63.6" height="24" rx="12.0" fill="#7fe0c8" fill-opacity="0.12" stroke="#7fe0c8" stroke-opacity="0.5"/><text x="446.2" y="244.2" font-size="11.5" fill="#e8fffa" textLength="41.6" lengthAdjust="spacingAndGlyphs">FastAPI</text><rect x="572" y="24" width="304" height="228" rx="14" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.08"/><text x="596" y="62" font-size="12.5" fill="#9fb8b2">Answerable questions covered</text><text x="852" y="64" font-size="22" font-weight="700" fill="#7fe0c8" text-anchor="end">96%</text><rect x="596" y="74" width="256" height="8" rx="4" fill="#fff" fill-opacity="0.1"/><rect x="596" y="74" width="245.8" height="8" rx="4" fill="#7fe0c8"><animate attributeName="width" from="0" to="245.8" dur="1.8s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="596" y="118" font-size="12.5" fill="#9fb8b2">Out-of-domain refused</text><text x="852" y="120" font-size="22" font-weight="700" fill="#ffb86b" text-anchor="end">73%+</text><rect x="596" y="130" width="256" height="8" rx="4" fill="#fff" fill-opacity="0.1"/><rect x="596" y="130" width="186.9" height="8" rx="4" fill="#ffb86b"><animate attributeName="width" from="0" to="186.9" dur="1.8s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><rect x="596" y="170" width="122" height="58" rx="12" fill="#7fe0c8" fill-opacity="0.1" stroke="#7fe0c8" stroke-opacity="0.35"/><text x="610" y="196" font-size="18.5" font-weight="700" fill="#fff">~150 ms</text><text x="610" y="214" font-size="11" fill="#9fb8b2">p50 latency</text><rect x="730" y="170" width="122" height="58" rx="12" fill="#7fe0c8" fill-opacity="0.1" stroke="#7fe0c8" stroke-opacity="0.35"/><text x="744" y="196" font-size="18.5" font-weight="700" fill="#fff">58 tests</text><text x="744" y="214" font-size="11" fill="#9fb8b2">CI pipeline</text></svg>