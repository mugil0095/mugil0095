s or modifies the plan. SQLite checkpoints</text><text x="24" y="167" font-size="13.5" fill="#cfe3de">keep runs resumable. FastAPI backend.</text><rect x="24.0" y="182" width="76.3" height="24" rx="12.0" fill="#6fb8ff" fill-opacity="0.12" stroke="#6fb8ff" stroke-opacity="0.5"/><text x="35.0" y="198.2" font-size="11" fill="#e8fffa" textLength="54.3" lengthAdjust="spacingAndGlyphs">LangGraph</text><rect x="107.3" y="182" width="61.8" height="24" rx="12.0" fill="#6fb8ff" fill-opacity="0.12" stroke="#6fb8ff" stroke-opacity="0.5"/><text x="118.3" y="198.2" font-size="11" fill="#e8fffa" textLength="39.8" lengthAdjust="spacingAndGlyphs">FastAPI</text><rect x="176.2" y="182" width="57.3" height="24" rx="12.0" fill="#6fb8ff" fill-opacity="0.12" stroke="#6fb8ff" stroke-opacity="0.5"/><text x="187.2" y="198.2" font-size="11" fill="#e8fffa" textLength="35.3" lengthAdjust="spacingAndGlyphs">Gemini</text><rect x="240.5" y="182" width="55.8" height="24" rx="12.0" fill="#6fb8ff" fill-opacity="0.12" stroke="#6fb8ff" stroke-opacity="0.5"/><text x="251.5" y="198.2" font-size="11" fill="#e8fffa" textLength="33.8" lengthAdjust="spacingAndGlyphs">SQLite</text></svg>