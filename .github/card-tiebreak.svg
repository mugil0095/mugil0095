<svg width="440" height="228" viewBox="0 0 440 228" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#12324a"/></linearGradient><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><clipPath id="c"><rect x="1" y="1" width="438" height="226" rx="18"/></clipPath><rect x="1" y="1" width="438" height="226" rx="18" fill="url(#bg)" stroke="#ffb86b" stroke-opacity="0.35"/><g clip-path="url(#c)"><rect x="-200" y="1" width="200" height="2" fill="url(#sh)"><animate attributeName="x" values="-200;440" dur="6s" repeatCount="indefinite"/></rect></g><circle cx="390" cy="24" r="105" fill="#ffb86b" fill-opacity="0.07"/><rect x="24" y="22" width="42" height="42" rx="12" fill="#ffb86b" fill-opacity="0.14" stroke="#ffb86b" stroke-opacity="0.5"/><g transform="translate(32.0 30.0) scale(1.085)" fill="none" stroke="#ffb86b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M7.5 10 H16.5 M7.5 14 H16.5"/></g><text x="78" y="46" font-size="20" font-weight="700" fill="#fff">tiebreak</text><text x="78" y="64" font-size="10.5" fill="#ffb86b" letter-spacing="1.1">MODEL SELECTION · STATISTICS</text><text x="24" y="104" font-size="13.5" fill="#cfe3de">Finds the cheapest model that is statistically</text><text x="24" y="125" font-size="13.5" fill="#cfe3de">tied with the best on your own data: hosted</text><text x="24" y="146" font-size="13.5" fill="#cfe3de">LLMs, Ollama and scikit-learn. Paired bootstrap